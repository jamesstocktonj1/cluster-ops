# Tailscale Kubernetes operator: puts selected Services on your tailnet.
# Needs the operator-oauth Secret (docs/TAILSCALE.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting this app also deletes what it created
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.2   # bump to upgrade; read the Tailscale release notes first
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/infrastructure/tailscale/values.yaml
    - repoURL: https://github.com/jamesstocktonj1/cluster-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the CRDs are too big for client-side apply
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
