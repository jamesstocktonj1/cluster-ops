# Longhorn: replicated block storage using the second disk on each worker.
# Do not push this until the workers have the Longhorn Talos extensions and the
# data disk (docs/STORAGE.md steps 1-3), or its pods will fail to start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  # No resources-finalizer on purpose: deleting this Application must never
  # cascade-delete Longhorn, because that would put your volumes at risk.
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0   # bump to upgrade; read Longhorn's upgrade notes first
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/infrastructure/longhorn/values.yaml
    - repoURL: https://github.com/jamesstocktonj1/cluster-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      selfHeal: true
      # No prune, for the same reason as Cilium: a bad commit must not delete storage.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Talos enforces the "baseline" Pod Security profile; Longhorn needs "privileged".
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
