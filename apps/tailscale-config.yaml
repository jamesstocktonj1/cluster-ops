# Services exposed on the tailnet (needs the operator's CRDs, so it syncs after it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting this app also deletes what it created
spec:
  project: default
  source:
    repoURL: https://github.com/jamesstocktonj1/cluster-ops.git
    targetRevision: main
    path: infrastructure/tailscale/config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
