# Workloads: each file in infrastructure/application/ is one app (WorkloadDeployment,
# Service and HTTPRoute together). Needs wasmcloud and envoy-gateway-config first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting this app also deletes what it created
spec:
  project: default
  source:
    repoURL: https://github.com/jamesstocktonj1/cluster-ops.git
    targetRevision: main
    path: infrastructure/application
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
