# wasmCloud v2: runtime-operator, CRDs, NATS (JetStream) and the wasmCloud hosts.
# See docs/WASMCLOUD.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wasmcloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/wasmcloud/charts   # OCI registry: no oci:// prefix in Argo
      chart: runtime-operator
      targetRevision: 2.12.0   # bump to upgrade; read the release notes first
      helm:
        releaseName: wasmcloud
        valueFiles:
          - $values/infrastructure/wasmcloud/values.yaml
    - repoURL: https://github.com/jamesstocktonj1/cluster-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: wasmcloud
  # The chart mints its CA and TLS certs with genCA/genSignedCert and only reuses
  # the live ones via Helm `lookup`, which Argo's offline render cannot do. Without
  # this, every sync rotates the CA and breaks NATS TLS for running pods
  # (BadSignature). Keep the live Secret data; see docs/WASMCLOUD.md.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: wasmcloud-ca
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wasmcloud-nats-tls
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wasmcloud-operator-tls
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wasmcloud-runtime-tls
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wasmcloud-data-tls
      jsonPointers: [/data]
  syncPolicy:
    automated:
      selfHeal: true
      # No prune: a bad commit must not delete the CRDs and, with them, every workload.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true   # needed for ignoreDifferences to apply on sync, not just in the diff
