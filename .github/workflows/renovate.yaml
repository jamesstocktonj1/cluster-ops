name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays; renovate.json restricts PRs to before 6am Monday
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would change without opening PRs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # RENOVATE_TOKEN must be a PAT or GitHub App token, not GITHUB_TOKEN: PRs opened with
      # GITHUB_TOKEN do not trigger the CI workflow. Needs contents, pull-requests and
      # workflows (read/write) on this repo.
      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.22
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: info
