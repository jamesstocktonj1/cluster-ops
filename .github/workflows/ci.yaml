name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yamllint
        run: |
          pip install yamllint==1.38.0
      - name: Lint YAML
        run: |
          yamllint --strict .

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Helm values files and the SOPS secret are not Kubernetes manifests, so they are
      # ignored. CRDs missing from the datree catalog (e.g. wasmCloud's) are skipped, not failed.
      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict -summary -ignore-missing-schemas
            -ignore-filename-pattern values\.yaml$
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            apps bootstrap infrastructure

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Lint and template every chart referenced from apps/
        run: |
          python3 scripts/helm-check.py
