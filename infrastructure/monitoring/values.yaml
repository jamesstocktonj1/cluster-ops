# Helm values for kube-prometheus-stack, deployed by Argo CD (apps/monitoring.yaml).
# Chart version is pinned in that Application, not here.
# Kept small: the Prometheus Operator, one Prometheus, node-exporter,
# kube-state-metrics and Grafana. No Alertmanager.

# Grafana, public at https://k8smetrics.jamesstockton.com via the Cloudflare Tunnel
# (docs/MONITORING.md). The chart adds Prometheus as a data source and loads its
# default Kubernetes dashboards.
grafana:
  enabled: true
  # Admin login comes from a Secret created by hand (docs/MONITORING.md), not
  # from git. Without this the chart generates a random password on every
  # render, which Argo CD would see as drift and keep rotating.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards and users made in the UI live in Grafana's SQLite database, so
  # keep it on a Longhorn volume. "sts" runs Grafana as a StatefulSet, which
  # avoids two pods fighting over the ReadWriteOnce volume during a rollout.
  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    size: 5Gi
  # Also reachable on the LAN: Cilium hands this Service an IP from its pool
  # (infrastructure/cilium/config/ip-pool.yaml) and answers ARP for it. The
  # annotation pins the address so a bookmark keeps working. It must be inside the
  # pool and not used by another Service. Plain HTTP; the Cloudflare route is separate.
  service:
    type: LoadBalancer
    port: 80
    annotations:
      lbipam.cilium.io/ips: "10.0.40.201"
  grafana.ini:
    server:
      # Must match the public hostname, or redirects and links point at the
      # in-cluster address. Side effect: logging in via the LAN IP redirects to
      # this hostname afterwards.
      root_url: https://k8smetrics.jamesstockton.com
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Every dashboard query goes to Prometheus, so prefer the same Proxmox host as it
  # (docs/TOPOLOGY.md). Only a preference: Grafana still starts elsewhere if that
  # host is full or down.
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus

alertmanager:
  enabled: false

# Talos binds these control plane components to localhost, so they can't be
# scraped from a pod; Cilium replaces kube-proxy.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up every PodMonitor/ServiceMonitor/rule in any namespace, not just
    # ones labelled with this Helm release.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 18GB
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      # Cap memory so a runaway Prometheus is OOM-killed on its own instead of
      # triggering Talos's node-level OOM controller (which kills the whole pod
      # cgroup and starves neighbours like Longhorn on small 4GB workers).
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
