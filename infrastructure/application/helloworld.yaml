# One app = one file: WorkloadDeployment, Service and HTTPRoute together.
#
#   tailnet device -> Tailscale proxy -> Envoy (matches /hello, rewrites Host + path) -> wasmCloud host
#
# All apps share one public hostname and are told apart by path prefix. wasmCloud
# routes on the Host header only (not the path, not X-Forwarded-Host), so the
# HTTPRoute rewrites Host to an internal per-app name, and that same name is the
# WorkloadDeployment's config.host. It never leaves the cluster, but it must be unique
# per app and match in both places below (helloworld.internal).
#
# To add an app: copy this file, change the names, the path prefix and the internal
# host. The shared hostname needs setting up only once (docs/TAILSCALE.md step 8).
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: helloworld
  namespace: application
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: helloworld   # the operator fills this Service's EndpointSlices
      components:
        - name: helloworld
          image: ghcr.io/wasmcloud/components/hello-world:0.1.0
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: helloworld.internal
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld
  namespace: application
spec:
  type: ClusterIP
  ports:
    - name: http       # must match the port name on the operator's EndpointSlice, or
                       # Envoy Gateway finds "no ready endpoints" and returns 503
      port: 80
      targetPort: 8080   # the host group's http.port in infrastructure/wasmcloud/values.yaml
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helloworld
  namespace: application
spec:
  parentRefs:
    - name: shared
      namespace: envoy-gateway-system
  hostnames:
    - apps.jamesstockton.com   # shared by every app (DNS -> tailnet IP); each takes its own path prefix
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hello
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: helloworld.internal   # must equal config.host above
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /         # /hello/x reaches the component as /x
      backendRefs:
        - name: helloworld
          port: 80
