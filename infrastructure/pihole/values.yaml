# Pi-hole chart values (chart version pinned in apps/pihole.yaml).
# Only differences from the chart defaults are listed.

# Three identical, independent Pi-holes in one Deployment. They are stateless on
# purpose (no volume, see below), so each one is configured only from this file.
replicaCount: 3

# Replace pods one at a time. Cilium only sends traffic to Ready pods, so DNS keeps
# working through an upgrade as long as two replicas are up.
strategyType: RollingUpdate
maxSurge: 0
maxUnavailable: 1

# Put each replica on a different worker. If two shared a node and that node died,
# you would lose two thirds of your DNS. DoNotSchedule makes this a hard rule.
# The labels match the ones this chart puts on its pods.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: pihole
        release: pihole

# --- DNS: the one LAN IP ------------------------------------------------------
serviceDns:
  # DNS needs port 53 over both UDP and TCP. A "mixed" Service carries both on one
  # LoadBalancer, so they share a single IP (the chart's default is two Services).
  mixedService: true
  type: LoadBalancer
  # Local = a node only accepts DNS if it runs a Pi-hole pod itself. That keeps the
  # real client IP, so the Pi-hole dashboard shows which device asked, not a node.
  # Cilium only announces the IP from nodes that have a pod, so this is safe.
  externalTrafficPolicy: Local
  annotations:
    # Pinned so the address never changes: this is what goes in the router's DHCP
    # DNS setting. Must be inside the pool (infrastructure/cilium/config/ip-pool.yaml)
    # and unused. 10.0.40.201 is Grafana and .202 is Argo CD.
    lbipam.cilium.io/ips: "10.0.40.203"

# --- Web admin UI -------------------------------------------------------------
# On its own LAN IP so you can open http://10.0.40.204/admin (https works too, with
# Pi-hole's self-signed certificate). A separate IP from DNS, not a shared one: each
# Service gets its own Cilium L2 announcer, and two Services sharing an address could
# be announced by different nodes.
#
# Each replica has its own settings and query log, and Local sends all traffic to the
# pod on the node announcing the IP. So you see one replica's dashboard, and it
# stays the same one (and your login keeps working) until that node or pod goes away.
# To look at a specific replica use a port-forward instead (docs/PIHOLE.md).
serviceWeb:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    lbipam.cilium.io/ips: "10.0.40.204"   # inside the pool and unused (.201 Grafana, .202 Argo CD, .203 DNS)

# We are not using Pi-hole as the DHCP server (the router does that), so skip the
# Service for it.
serviceDhcp:
  enabled: false

# --- Admin password -----------------------------------------------------------
# Not in git. Create the Secret by hand first (docs/PIHOLE.md); the pods will not
# start until it exists. The key inside it must be called "password".
admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password

# --- DNS behaviour ------------------------------------------------------------
# Where Pi-hole forwards the queries it does not block.
DNS1: "1.1.1.1"
DNS2: "1.0.0.1"

extraEnvVars:
  # Answer queries arriving on any interface. Needed in a pod: the traffic comes in
  # from the Service, not from the pod's "local" network.
  FTLCONF_dns_listeningMode: "all"
  TZ: "Europe/London"

# Block lists, one URL per line. Because there is no volume, this file is the only
# place they live; change it here, not in the UI (UI changes vanish on restart).
adlists:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt

# --- Storage ------------------------------------------------------------------
# No PersistentVolumeClaim. A single ReadWriteOnce volume cannot be shared by three
# pods on three nodes, and three volumes would need three Deployments. The cost:
# the query log and anything changed in the web UI reset when a pod restarts.
persistentVolumeClaim:
  enabled: false

# Small and steady; requests also help the scheduler place them.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
