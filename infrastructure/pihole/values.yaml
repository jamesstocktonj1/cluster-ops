# Pi-hole chart values (chart version pinned in apps/pihole-1.yaml, -2, -3).
# Only differences from the chart defaults are listed.

# Used by three Argo CD apps (apps/pihole-1.yaml, -2, -3): one Helm release each, so
# every Pi-hole gets its own Service name. The Dobbelt dashboard
# (infrastructure/pihole/manifests/dashboard.yaml) needs that: it points at each
# Pi-hole by a stable address, and a Deployment's pods have none. The three are
# identical and independent (no volume, see below); they differ only by release name.
replicaCount: 1

# Replace the pod in place. maxSurge 0 matters: with the hard spread rule below, a
# surge pod would have nowhere to go. DNS keeps working through an upgrade because
# only one release is updated at a time, and Cilium only sends traffic to Ready pods.
strategyType: RollingUpdate
maxSurge: 0
maxUnavailable: 1

# Put each Pi-hole on a different worker. If two shared a node and that node died,
# you would lose two thirds of your DNS. DoNotSchedule makes this a hard rule.
# The selector has no `release` label on purpose: it must match the pods of all three
# releases (each release only has one pod, so a per-release selector would spread
# nothing). `app: pihole` is the label this chart puts on every pod.
#
# Also spread over the two Proxmox hosts (2 + 1), so losing a whole host still leaves
# DNS running. That one is a preference (ScheduleAnyway): with a host down, the
# replacement pod must still be able to start on the other host.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: pihole
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app: pihole

# --- Services -----------------------------------------------------------------
# Neither Service of a release is on the LAN. The chart cannot turn its DNS Service
# off, so it is kept as an unused ClusterIP.
#
# The LAN DNS address (10.0.40.203) is one shared LoadBalancer Service over all three
# pods: infrastructure/pihole/manifests/dns-service.yaml.
#
# The web/API Service (pihole-N-web, port 80) is what the dashboard talks to. The
# Pi-hole admin pages are not on a LAN IP any more; use the dashboard
# (10.0.40.204), or a port-forward to one Pi-hole (docs/PIHOLE.md).
serviceDns:
  mixedService: true
  type: ClusterIP

serviceWeb:
  type: ClusterIP
  https:
    enabled: false   # the dashboard uses plain http inside the cluster

# We are not using Pi-hole as the DHCP server (the router does that), so skip the
# Service for it.
serviceDhcp:
  enabled: false

# --- Admin password -----------------------------------------------------------
# Not in git. Create the Secret by hand first (docs/PIHOLE.md); the pods will not
# start until it exists. The key inside it must be called "password".
admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password

# --- DNS behaviour ------------------------------------------------------------
# Where Pi-hole forwards the queries it does not block.
DNS1: "1.1.1.1"
DNS2: "1.0.0.1"

extraEnvVars:
  # Answer queries arriving on any interface. Needed in a pod: the traffic comes in
  # from the Service, not from the pod's "local" network.
  FTLCONF_dns_listeningMode: "all"
  TZ: "Europe/London"

# Block lists, one URL per line. Because there is no volume, this file is the only
# place they live; change it here, not in the UI (UI changes vanish on restart).
adlists:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt

# --- Storage ------------------------------------------------------------------
# No PersistentVolumeClaim. A single ReadWriteOnce volume cannot be shared by three
# pods on three nodes, and three volumes would need three Deployments. The cost:
# the query log and anything changed in the web UI reset when a pod restarts.
persistentVolumeClaim:
  enabled: false

# --- Metrics ------------------------------------------------------------------
# Pi-hole has no Prometheus endpoint of its own. The chart can add an "exporter"
# container to every pod (ekofr/pihole-exporter) that logs in to that pod's Pi-hole
# API with the admin password above and republishes the stats on port 9617.
# The PodMonitor tells Prometheus (infrastructure/monitoring) to scrape it. It is
# created in this namespace; Prometheus is set up to find monitors in any namespace.
# Each replica is scraped separately, so every series carries a `pod` label.
monitoring:
  sidecar:
    enabled: true
  podMonitor:
    enabled: true
    interval: 30s

# Small and steady; requests also help the scheduler place them.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
