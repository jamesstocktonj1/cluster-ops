# Pi-hole chart values (chart version pinned in apps/pihole.yaml).
# Only differences from the chart defaults are listed.

# Shared by three separate Helm releases (pihole-1, -2, -3), generated by
# apps/pihole.yaml. Each release is one Pi-hole with its own LAN IPs, which are set
# there, not here. They are stateless on purpose (no volume, see below), so each one
# is configured only from this file.
replicaCount: 1

# Replace the pod in place (no extra pod). That Pi-hole's IP is briefly down during an
# upgrade, but the other two keep answering, so clients with all three IPs are fine.
strategyType: RollingUpdate
maxSurge: 0
maxUnavailable: 1

# Put each Pi-hole on a different worker. If two shared a node and that node died,
# you would lose two thirds of your DNS. DoNotSchedule makes this a hard rule.
# Matches on `app` only (not `release`) so it counts the pods of all three releases.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: pihole

# --- DNS: one LAN IP per Pi-hole ----------------------------------------------
# The IP itself (lbipam.cilium.io/ips) is set per release in apps/pihole.yaml.
serviceDns:
  # DNS needs port 53 over both UDP and TCP. A "mixed" Service carries both on one
  # LoadBalancer, so they share a single IP (the chart's default is two Services).
  mixedService: true
  type: LoadBalancer
  # Local = a node only accepts DNS if it runs a Pi-hole pod itself. That keeps the
  # real client IP, so the Pi-hole dashboard shows which device asked, not a node.
  # Cilium only announces the IP from nodes that have a pod, so this is safe.
  externalTrafficPolicy: Local

# --- Web admin UI -------------------------------------------------------------
# Also its own LAN IP per Pi-hole (set in apps/pihole.yaml), so http://<web ip>/admin
# opens exactly that Pi-hole (https works too, with its self-signed certificate). A
# separate IP from DNS, not a shared one: each Service gets its own Cilium L2
# announcer, and two Services sharing an address could be announced by different nodes.
serviceWeb:
  type: LoadBalancer
  externalTrafficPolicy: Local

# We are not using Pi-hole as the DHCP server (the router does that), so skip the
# Service for it.
serviceDhcp:
  enabled: false

# --- Admin password -----------------------------------------------------------
# Not in git. Create the Secret by hand first (docs/PIHOLE.md); the pods will not
# start until it exists. The key inside it must be called "password".
admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password

# --- DNS behaviour ------------------------------------------------------------
# Where Pi-hole forwards the queries it does not block.
DNS1: "1.1.1.1"
DNS2: "1.0.0.1"

extraEnvVars:
  # Answer queries arriving on any interface. Needed in a pod: the traffic comes in
  # from the Service, not from the pod's "local" network.
  FTLCONF_dns_listeningMode: "all"
  TZ: "Europe/London"

# Block lists, one URL per line. Because there is no volume, this file is the only
# place they live; change it here, not in the UI (UI changes vanish on restart).
adlists:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt

# --- Storage ------------------------------------------------------------------
# No PersistentVolumeClaim, to keep each Pi-hole free to run on any node. The cost:
# the query log and anything changed in the web UI reset when a pod restarts.
persistentVolumeClaim:
  enabled: false

# --- Metrics ------------------------------------------------------------------
# Pi-hole has no Prometheus endpoint of its own. The chart can add an "exporter"
# container to every pod (ekofr/pihole-exporter) that logs in to that pod's Pi-hole
# API with the admin password above and republishes the stats on port 9617.
# The PodMonitor tells Prometheus (infrastructure/monitoring) to scrape it. It is
# created in this namespace; Prometheus is set up to find monitors in any namespace.
# Each replica is scraped separately, so every series carries a `pod` label.
monitoring:
  sidecar:
    enabled: true
  podMonitor:
    enabled: true
    interval: 30s

# Small and steady; requests also help the scheduler place them.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
