# StorageClasses that keep both replicas of a volume on one Proxmox host. Writes then
# go over that host's virtual bridge (10G+), never the 1G link between hosts.
#
# The trade-off: the volume survives losing a VM (a node upgrade, a crashed worker),
# but not losing the whole Proxmox host. Use these for data that is heavy to write and
# cheap to lose (Prometheus), and pin the pod to the same host, or every read and
# write crosses the link instead (docs/TOPOLOGY.md).
#
# nodeSelector matches Longhorn node tags, which come from the
# node.longhorn.io/default-node-tags annotation in talos/talconfig.yaml.
# StorageClass parameters cannot be changed after creation: to change one, delete the
# StorageClass and let Argo CD recreate it (existing volumes are not affected).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-stack
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: best-effort
  nodeSelector: stack
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-stacklite
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: best-effort
  nodeSelector: stacklite
