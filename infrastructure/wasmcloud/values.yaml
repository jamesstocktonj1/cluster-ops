# wasmCloud v2 runtime-operator chart values (chart version pinned in apps/wasmcloud.yaml).
# Only differences from the chart defaults are listed.
gateway:
  enabled: false   # deprecated since 2.0.3; HTTP goes via EndpointSlices on normal Services
runtime:
  hostGroups:
    - name: default     # WorkloadDeployments select this with hostSelector.hostgroup
      # One host pod per worker, so two on each Proxmox host. The chart has no
      # affinity or spread settings; the scheduler's default spreading places them.
      replicas: 4
      service:
        type: ClusterIP
      http:
        enabled: true
        port: 8080
