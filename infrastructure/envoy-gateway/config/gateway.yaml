# Envoy proxy settings. Gives the proxy Service a fixed name (otherwise it is
# generated, e.g. envoy-envoy-gateway-system-shared-1a2b3c4d) and puts it on the
# tailnet as apps.<tailnet>.ts.net (docs/TAILSCALE.md). Apps are tailnet-only.
#
# This lives here rather than in infrastructure/tailscale/config because Envoy Gateway
# owns and regenerates this Service; a second hand-written Service would have to
# guess its pod selector.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shared
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: envoy
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: apps
          tailscale.com/tags: "tag:k8s"
        # The Tailscale proxy reaches Envoy through this Service's ClusterIP. Prefer
        # the Envoy pod on the proxy's own Proxmox host (docs/TOPOLOGY.md).
        patch:
          type: StrategicMerge
          value:
            spec:
              trafficDistribution: PreferSameZone
      envoyDeployment:
        replicas: 2
        # One Envoy per Proxmox host: apps stay up if a host goes down, and each
        # host has a local Envoy for the Service above to prefer. ScheduleAnyway so a
        # rollout is never blocked while a host is down.
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: shared
                  gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shared
    namespace: envoy-gateway-system
---
# The one Gateway every app attaches its HTTPRoute to. Plain HTTP only: traffic
# arrives over the tailnet, which is already encrypted by WireGuard.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All   # apps live in their own namespaces and bring their own route
